# Local Postgres for development.
# Host port 5433 (not 5432) so it does not clash with a Postgres already installed on the machine.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: daily_loop
      POSTGRES_PASSWORD: daily_loop
      POSTGRES_DB: daily_loop
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daily_loop -d daily_loop']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
