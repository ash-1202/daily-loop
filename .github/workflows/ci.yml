name: CI

# Every pull request is checked before it can be merged. deploy.yml reuses this workflow,
# so main is only deployed after exactly the same checks pass.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The tests need a real Postgres (they create a separate daily_loop_test database).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: daily_loop
          POSTGRES_PASSWORD: daily_loop
          POSTGRES_DB: daily_loop
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U daily_loop -d daily_loop"
          --health-interval 2s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgres://daily_loop:daily_loop@localhost:5433/daily_loop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run datasets:check
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
